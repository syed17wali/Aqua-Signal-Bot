name: SMC Signal Checker

# Runs every 15 minutes, automatically, forever — no laptop needed
on:
  schedule:
    - cron: "*/15 * * * *"       # every 15 minutes — regular signal check
    - cron: "0 19 * * *"          # 19:00 UTC = 00:00 (midnight) PKT — daily summary
  workflow_dispatch:  # allows manual trigger from GitHub website too

jobs:
  check-signal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run signal check
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 19 * * *" ]; then
            python smc_strategy.py summary
          else
            python smc_strategy.py
          fi

      - name: Save signal history
        run: |
          git config user.name "SMC Bot"
          git config user.email "bot@smcbot.local"
          git add signal_history.csv
          git diff --quiet --cached || git commit -m "Update signal history"
          git push